spring.application.name=paymentservice
server.port=8082

# MySQL. The password comes from an environment variable.
spring.datasource.url=jdbc:mysql://localhost:3306/paymentservice
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A refused request shows a clear reason.
spring.mvc.problemdetails.enabled=true

# Class 19: how to check a login token (the same settings as the catalog).
shopnest.auth.jwk-set-uri=${AUTH_JWKS_URL:http://localhost:8081/.well-known/jwks.json}
shopnest.auth.issuer=userauthservice
shopnest.auth.audience=shopnest-api

# Class 15: no outside call may wait forever.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# Razorpay. The keys come from environment variables and are never written in a file.
razorpay.base-url=${RAZORPAY_URL:https://api.razorpay.com}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Our own settings.
payment.link-expiry-minutes=30
payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:8082/payments/callback}
